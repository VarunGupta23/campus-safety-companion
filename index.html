<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Safety Companion</title>
    <meta name="description" content="Immediate step-by-step first-aid protocols and hazard guidance.">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Use system fonts in CSS to remain lightweight -->
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Campus Safety</h1>
            <div class="controls">
                <label for="language-select" class="sr-only">Select Language</label>
                <select id="language-select" aria-label="Language selection">
                    <option value="English">English</option>
                    <option value="Hindi">हिन्दी</option>
                </select>
                <button id="focus-toggle" aria-pressed="false" title="Toggle Focus Mode">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3z"></path><path d="M14 3h7v7h-7z"></path><path d="M14 14h7v7h-7z"></path><path d="M3 14h7v7H3z"></path></svg>
                    <span class="sr-only">Focus Mode</span>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content">
        <!-- Input Section -->
        <section id="input-section" class="card" aria-labelledby="input-heading">
            <h2 id="input-heading">What happened?</h2>
            <form id="incident-form">
                <div class="form-group">
                    <label for="incident-description">Describe Situation (Optional if photo provided)</label>
                    <textarea id="incident-description" rows="3" placeholder="e.g. Someone slipped on a wet floor and hurt their knee..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="incident-photo" class="photo-upload-label">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                        <span>Add / Capture Photo</span>
                    </label>
                    <input type="file" id="incident-photo" accept="image/jpeg, image/png, image/webp" class="sr-only">
                    <div id="photo-preview-container" class="hidden">
                        <img id="photo-preview" src="" alt="Photo preview">
                        <button type="button" id="remove-photo" aria-label="Remove photo">&times;</button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-btn" class="primary-btn">
                        <span>Get Safety Guidance</span>
                    </button>
                </div>
            </form>
            
            <div id="loading-indicator" class="hidden" aria-live="polite">
                <div class="spinner"></div>
                <p>Analyzing situation...</p>
            </div>
        </section>

        <!-- Results Section -->
        <section id="results-section" class="hidden" aria-live="polite" aria-labelledby="assessment-heading" role="region">
            
            <div id="urgency-badge" class="badge"></div>
            
            <h2 id="assessment-heading" class="sr-only" tabindex="-1">Safety Assessment</h2>
            
            <div class="summary-box">
                <p id="result-summary"></p>
            </div>

            <div class="grid-container">
                <div class="action-card do-card">
                    <h3>What To Do Now</h3>
                    <ol id="result-immediate-actions"></ol>
                </div>

                <div class="action-card avoid-card">
                    <h3>Avoid</h3>
                    <ul id="result-avoid"></ul>
                </div>
            </div>

            <div class="warning-section">
                <h3>Watch For</h3>
                <ul id="result-warnings"></ul>
                <p id="result-professional-help" class="help-text"></p>
            </div>

            <button type="button" id="reset-btn" class="secondary-btn">New Incident</button>
        </section>

        <!-- Emergency Contacts (Always Visible) -->
        <section class="emergency-contacts" aria-labelledby="contacts-heading" role="region">
            <h2 id="contacts-heading" class="sr-only">Campus Support</h2>
            <p class="contacts-title">Campus Support</p>
            <div class="contact-buttons">
                <a href="tel:911" class="contact-btn urgent" aria-label="Call Medical Room">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    Medical Room
                </a>
                <a href="tel:911" class="contact-btn" aria-label="Call Campus Security">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Campus Security
                </a>
            </div>
        </section>
    </main>

    <script src="js/image_utils.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
